<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/no-inspect.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prelimsify — offline</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff;color:#000;
       display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;margin:0;padding:24px;}
  .box{max-width:360px;}
  h1{font-size:22px;margin-bottom:8px;}
  p{color:#555;margin-bottom:20px;}
  button{background:#000;color:#fff;border:none;padding:12px 20px;border-radius:8px;font-size:15px;cursor:pointer;}
</style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>Prelimsify needs an internet connection to load your tests, saved projects, and scores.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
