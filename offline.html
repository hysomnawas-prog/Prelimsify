<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/no-inspect.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prelimsify — offline</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Segoe UI,Roboto,sans-serif;color:#1d1d1f;
       display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;margin:0;padding:24px;
       background:
         radial-gradient(1100px 700px at 8% -10%, rgba(200,205,213,.55), transparent 60%),
         radial-gradient(900px 700px at 100% 0%, rgba(226,229,234,.55), transparent 55%),
         radial-gradient(1000px 800px at 50% 110%, rgba(180,186,195,.40), transparent 55%),
         linear-gradient(160deg,#e9ebee 0%, #dfe2e6 45%, #eceeef 100%);
       background-attachment:fixed;}
  .box{max-width:360px;background:linear-gradient(135deg, rgba(255,255,255,.85) 0%, rgba(222,226,232,.58) 100%);-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);
       border:1px solid rgba(255,255,255,.78);border-radius:24px;padding:32px 28px;box-shadow:0 20px 60px rgba(66,71,79,.22);}
  h1{font-size:22px;margin-bottom:8px;}
  p{color:#6e6e73;margin-bottom:20px;}
  button{background:linear-gradient(135deg,#8f959c 0%, #52565c 50%, #26282c 100%);color:#fff;border:1px solid rgba(255,255,255,.35);padding:12px 24px;border-radius:999px;font-size:15px;cursor:pointer;
         transition:transform .32s cubic-bezier(.25,1,.5,1), filter .32s cubic-bezier(.25,1,.5,1);}
  button:hover{transform:scale(1.05) translateY(-2px);filter:brightness(1.08);}
</style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>Prelimsify needs an internet connection to load your tests, saved projects, and scores.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
