<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prelimsify Admin</title><link rel="stylesheet" href="css/styles.css?v=20260903"><style>
.admin-page{min-height:100vh;background:#fff;padding:28px 18px;font-family:var(--sans)}.admin-wrap{max-width:1000px;margin:auto}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:2px solid #000;padding-bottom:15px}.admin-head h1{font-family:var(--serif);margin:0}.admin-note{font-size:12px;color:var(--ink-soft);margin:15px 0}.admin-table{width:100%;border-collapse:collapse;font-size:12px}.admin-table th,.admin-table td{padding:11px 9px;border-bottom:1px solid #ddd;text-align:left}.admin-table th{font-size:11px;text-transform:uppercase;letter-spacing:.05em}.permission-btn{border:1px solid #999;background:#fff;border-radius:4px;padding:6px 9px;font:700 11px var(--sans);cursor:pointer}.permission-btn.revoke{color:#8c1d17}.permission-btn.grant{color:#155a20}.admin-status{min-height:18px;font-size:12px;margin:10px 0}.admin-protected{font-size:11px;font-weight:700;color:#555}.admin-error{color:#8c1d17}.admin-ok{color:#155a20}.admin-loading{text-align:center;padding:30px;color:#555}@media(max-width:700px){.admin-table{font-size:11px}.admin-table th:nth-child(3),.admin-table td:nth-child(3){display:none}.admin-head{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="admin-page"><div class="admin-wrap"><header class="admin-head"><div><h1>Prelimsify Admin</h1><div id="adminIdentity" class="admin-note"></div></div><div><a class="btn secondary" href="index.html">Back to app</a> <button class="btn secondary" id="adminLogout">Logout</button></div></header><div id="adminStatus" class="admin-status"></div><p class="admin-note">Grant/revoke access for user accounts. Passwords are intentionally not displayed: Supabase Auth stores passwords securely and never exposes them to the browser or administrator.</p><table class="admin-table"><thead><tr><th>Username</th><th>Role</th><th>Password</th><th>Permission</th><th>Action</th></tr></thead><tbody id="adminUsers"><tr><td colspan="5" class="admin-loading">Checking administrator access…</td></tr></tbody></table></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/admin.js?v=20260903"></script></body></html>
